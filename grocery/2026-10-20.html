*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{padding-top:12px;padding-bottom:10px}
.brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
h1{font-size:22px;margin:2px 0 2px}
.sub{color:var(--mut);font-size:14px}
details.upd{margin-top:10px;border:1px solid #c6f6d5;border-left:5px solid var(--g);border-radius:10px;background:var(--gl)}
details.upd summary{cursor:pointer;padding:10px 14px;font-weight:800;color:var(--g2);min-height:44px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.upd summary::-webkit-details-marker{display:none}
details.upd summary::after{content:"Show ▾";font-weight:600;font-size:13px;color:var(--g)}
details.upd[open] summary::after{content:"Hide ▴"}
.updbody{padding:0 14px 10px;font-size:15px}
.updbody p{margin:0 0 6px}.updbody ul{margin:0;padding-left:18px}.updbody li{margin:4px 0}
.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:14px;color:var(--mut)}
.chg button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid #cbd2d9;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chg button.c-new{border-color:#f6ad55;color:#7b341e}.chg button.c-changed{border-color:#90cdf4;color:#2a4365}.chg button.c-ended{border-color:#cbd5e0;color:#4a5568}
.wl{padding:0 14px 12px}
.wi{padding:9px 0;border-top:1px solid var(--line)}
.wi b{display:block}

.wi .small{font-size:13px;color:var(--mut)}
.wi .best{font-size:14px;margin-top:2px}
.wrule{font-size:13px;color:var(--mut);margin:8px 0 0}
.wfoot{font-size:13px;font-weight:700;color:#2c5282;margin:6px 0 0}
.bar{position:sticky;top:0;z-index:5;background:rgba(245,247,246,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:8px;padding-bottom:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border:1px solid #cbd2d9;border-radius:12px;padding:0 40px 0 14px;background:#fff;font-size:16px}
.search .x{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:none;font-size:20px;color:var(--mut);display:none}
.fbtn{height:46px;min-width:46px;padding:0 14px;border-radius:12px;border:1px solid #cbd2d9;background:#fff;font-weight:700;white-space:nowrap}
.fbtn[aria-expanded=true]{background:var(--g);color:#fff;border-color:var(--g)}
.quick{background:#fff;border-bottom:1px solid var(--line)}
.quick .wrap{padding-top:8px;padding-bottom:4px}
.cg{display:contents}
.sep{flex:0 0 1px;background:#cbd2d9;margin:4px 2px}
.panel{background:#fff;border-bottom:1px solid var(--line)}
.panel .wrap{padding-top:8px;padding-bottom:10px}
.panel[hidden]{display:none}
.lab{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;scrollbar-width:none}

.chips.wrapok{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #cbd2d9;background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.chip .n{font-weight:500;opacity:.7;font-size:13px;margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row label{display:flex;align-items:center;gap:6px;font-size:15px}

.card h3{font-size:16px;margin:0;line-height:1.3}

.price.terms{font-size:15px;white-space:normal;max-width:45%}

.deal{font-size:14.5px}
.unit{font-size:13.5px;color:#334e68;font-weight:600}

.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid}
.t-changed{background:#bee3f8;color:#2a4365;border-color:#63b3ed}
.t-ended{background:#edf2f7;color:#4a5568;border-color:#a0aec0}
.card.ended{opacity:.75;background:#fafafa}
.was{font-size:13px;color:#2a4365}
.t-new{background:#feebc8;color:#7b341e;border-color:#f6ad55}
.t-coupon{background:#e6fffa;color:#234e52;border-color:#81e6d9}
.kind{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#2b6cb0}
.t-bogo{background:#fefcbf;color:#744210;border-color:#ecc94b}

.stack{font-size:13px;background:#faf5ff;border:1px solid #e9d8fd;border-radius:8px;padding:6px 8px;color:#44337a}

const M = DATA.meta, ITEMS = DATA.items;

function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const set = (k, vals) => { st[k] = new Set((h.get(k)||'').split(',').filter(Boolean).map(v=>v.toLowerCase()).filter(v=>vals.includes(v))); };
  set('store', STORES.map(slug)); set('cat', CATS.map(slug)); set('tag', TAGS.map(t=>t[0]));
  st.q = h.get('q') || '';
  st.sort = ['category','store','price','savings','newest'].includes(h.get('sort')) ? h.get('sort') : 'category';
  st.group = ['store','category','none'].includes(h.get('group')) ? h.get('group') : 'store';
  st.gm = h.get('gm') === '1';
}
function writeHash(){
  const p = [];
  if (st.store.size) p.push('store=' + [...st.store].join(','));
  if (st.cat.size) p.push('cat=' + [...st.cat].join(','));
  if (st.tag.size) p.push('tag=' + [...st.tag].join(','));
  if (st.q) p.push('q=' + encodeURIComponent(st.q));
  if (st.sort !== 'category') p.push('sort=' + st.sort);
  if (st.group !== 'store') p.push('group=' + st.group);
  if (st.gm) p.push('gm=1');
  const h = p.join('&');
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function base(all){ return ITEMS.filter(it => (st.gm || !it.gm) && (all || st.tag.has('ended') || !it.t.includes('ended'))); }
function match(it, skip){
  if (skip !== 'store' && st.store.size && !st.store.has(slug(it.s))) return false;
  if (skip !== 'cat' && st.cat.size && !st.cat.has(slug(it.c))) return false;
  if (skip !== 'tag' && st.tag.size && ![...st.tag].every(t => it.t.includes(t))) return false;
  if (st.q){ const hay = (it.n+' '+it.b+' '+it.sz).toLowerCase(); if (!st.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false; }
  return true;
}
function chips(el, list, key, labelOf, valOf, count){
  el.innerHTML = list.map(x => { const v = valOf(x), n = count(v);
    return `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${st[key].has(v)}">${esc(labelOf(x))}<span class="n">${n}</span></button>`; }).join('');
}
function renderChips(){
  const b = base();
  const cnt = (skip, f) => v => b.filter(it => match(it, skip) && f(it, v)).length;
  chips($('stores'), STORES, 'store', s=>s, slug, cnt('store', (it,v)=>slug(it.s)===v));
  const ba = base(true), cntT = v => ba.filter(it => match(it, 'tag') && it.t.includes(v)).length;
  chips($('tags'), TAGS, 'tag', t => t[0]==='kid' ? 'Kid-friendly (maybe)' : t[1], t=>t[0], cntT);
  chips($('cats'), CATS, 'cat', c=>c, slug, cnt('cat', (it,v)=>slug(it.c)===v));
}
const money = v => '$' + v.toFixed(2);
const KIND = {coupon:'Digital coupon', matchup:'Coupon matchup'};
function card(it){
  const priced = it.p != null;
  const ptxt = priced ? `${money(it.p)}<small>${it.per==='lb' ? 'per lb' : (it.t.includes('bogo') || /\d\s*(for|\/)\s*\$/i.test(it.deal) ? 'each (est.)' : '')}</small>` : esc(it.deal || 'See ad');
  const meta = [it.b && it.b !== 'Other' && !it.n.toLowerCase().includes(it.b.toLowerCase()) ? it.b : '', it.sz].filter(Boolean).map(esc).join(' · ');
  const deal = priced ? esc(it.deal) + (it.terms ? ' · ' + esc(it.terms) : '') : esc(it.terms);
  const save = it.pct ? `<span class="save">save ${it.pct}%${it.sv ? ' (' + money(it.sv) + ')' : ''}</span>` : '';
  const tags = it.t.map(t => `<span class="tag t-${t}">${esc(t==='kid' ? 'Kid-friendly?' : TAGL[t])}</span>`).join('');

  return `<article class="card${it.t.includes('ended') ? ' ended' : ''}" data-id="${it.id}" data-k="${it.k}">
${KIND[it.k] ? `<div class="kind">${KIND[it.k]}</div>` : ''}

${meta ? `<div class="meta">${meta}</div>` : ''}

${tags ? `<div class="tags">${tags}</div>` : ''}

}
function sorter(){
  const si = s => STORES.indexOf(s), ci = c => CATS.indexOf(c);
  const pri = it => (it.t.includes('best')?0:it.k==='deal'?1:2);
  const md = s => { const m = /(\d+)\/(\d+)/.exec(s||''); return m ? (+m[1])*40 + (+m[2]) : -1; };
  const nm = (a,b) => pri(a)-pri(b) || (a.p==null)-(b.p==null) || a.n.localeCompare(b.n);
  return {category:(a,b)=>ci(a.c)-ci(b.c)||si(a.s)-si(b.s)||nm(a,b),
          store:(a,b)=>si(a.s)-si(b.s)||ci(a.c)-ci(b.c)||nm(a,b),
          price:(a,b)=>(a.p==null)-(b.p==null)||(a.p??0)-(b.p??0)||nm(a,b),
          newest:(a,b)=>b.t.includes('new')-a.t.includes('new')||b.t.includes('changed')-a.t.includes('changed')||md(b.st)-md(a.st)||ci(a.c)-ci(b.c)||nm(a,b),
          savings:(a,b)=>(a.pct==null)-(b.pct==null)||(b.pct??0)-(a.pct??0)||(b.sv??0)-(a.sv??0)||nm(a,b)}[st.sort];
}
function render(){
  writeHash(); renderChips();
  $('q').value = st.q; $('qx').style.display = st.q ? 'block' : 'none';
  $('sort').value = st.sort; $('group').value = st.group; $('gm').checked = st.gm;
  const b = base(), res = b.filter(it => match(it)).sort(sorter());
  const nf = st.store.size + st.cat.size + st.tag.size + (st.q?1:0);

  const act = [...[...st.store].map(v=>STORES.find(x=>slug(x)===v)), ...[...st.tag].map(t=>t==='kid'?'Kid-friendly':TAGL[t]), ...[...st.cat].map(v=>CATS.find(x=>slug(x)===v)), st.q ? `"${st.q}"` : ''].filter(Boolean);
  $('count').textContent = `Showing ${res.length} of ${b.length} items` + (act.length ? ` · ${act.join(' + ')}` : '');

  if (!res.length){ $('list').innerHTML = '<div class="empty">No deals match. Try clearing a filter.</div>'; return; }
  const vis = res.slice(0, shown);
  let html = '';
  if (st.group === 'none') html = `<div class="grid">${vis.map(card).join('')}</div>`;
  else {
    const key = st.group === 'store' ? 's' : 'c', order = st.group === 'store' ? STORES : CATS;
    const tot = {}; res.forEach(it => tot[it[key]] = (tot[it[key]]||0)+1);

      html += `<h2 class="grp">${st.group==='store' ? `<span class="st s-${g}">${g}</span>` : esc(g)} <span class="cnt">${tot[g]} ${tot[g] === 1 ? 'item' : 'items'}</span></h2><div class="grid">${gi.map(card).join('')}</div>`; });
  }

}
