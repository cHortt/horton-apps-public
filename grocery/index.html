.publix.com/savings/weekly-ad","lt":"Publix weekly ad","id":"e0","t":["ended"],"notes":["Was on the 2026-10-26 page; gone today."],"stack":[]},{"k":"coupon","n":"King’s Hawaiian 12 or 24 CT, Original or Savory Sliders, Hot Dog & Hamburger Buns","b":"King's Hawaiian","sz":"","s":"Publix","c":"Pet","deal":"Save $1.00","terms":"Publix digital coupon: clip it in the Publix app or at publix.com","p":null,"per":"","u":"","sv":1.0,"pct":null,"v":"10/8–11/12","st":"10/8","gm":false,"link":"https://www.publix.com/savings/digital-coupons","lt":"Publix digital coupons","id":"e1","t":["ended"],"notes":["Was on the 2026-10-26 page; gone today."],"stack":[]},{"k":"coupon","n":"NEUTROGENA Facial Moisturizer, Serum or Treatment","b":"Neutrogena","sz":"","s":"Publix","c":"Health & Beauty","deal":"Save $5.00","terms":"Publix digital coupon: clip it in the Publix app or at publix.com","p":null,"per":"","u":"","sv":5.0,"pct":null,"v":"10/4–10/31","st":"10/4","gm":false,"link":"https://www.publix.com/savings/digital-coupons","lt":"Publix digital coupons","id":"e2","t":["ended"],"notes":["Was on the 2026-10-26 page; gone today."],"stack":[]}]};
const M = DATA.meta, ITEMS = DATA.items;
const STORES = ['Publix','Aldi','Walmart'];
const CATS = M.cats, TAGS = M.tags, TAGL = Object.fromEntries(TAGS);
const slug = s => s.toLowerCase().replace(/&/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const st = {store:new Set(), cat:new Set(), tag:new Set(), q:'', sort:'category', group:'store', gm:false};
const PAGE = 120; let shown = PAGE;

function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const set = (k, vals) => { st[k] = new Set((h.get(k)||'').split(',').filter(Boolean).map(v=>v.toLowerCase()).filter(v=>vals.includes(v))); };
  set('store', STORES.map(slug)); set('cat', CATS.map(slug)); set('tag', TAGS.map(t=>t[0]));
  st.q = h.get('q') || '';
  st.sort = ['category','store','price','savings','newest'].includes(h.get('sort')) ? h.get('sort') : 'category';
  st.group = ['store','category','none'].includes(h.get('group')) ? h.get('group') : 'store';
  st.gm = h.get('gm') === '1';
}
function writeHash(){
  const p = [];
  if (st.store.size) p.push('store=' + [...st.store].join(','));
  if (st.cat.size) p.push('cat=' + [...st.cat].join(','));
  if (st.tag.size) p.push('tag=' + [...st.tag].join(','));
  if (st.q) p.push('q=' + encodeURIComponent(st.q));
  if (st.sort !== 'category') p.push('sort=' + st.sort);
  if (st.group !== 'store') p.push('group=' + st.group);
  if (st.gm) p.push('gm=1');
  const h = p.join('&');
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}
function base(all){ return ITEMS.filter(it => (st.gm || !it.gm) && (all || st.tag.has('ended') || !it.t.includes('ended'))); }
function match(it, skip){
  if (skip !== 'store' && st.store.size && !st.store.has(slug(it.s))) return false;
  if (skip !== 'cat' && st.cat.size && !st.cat.has(slug(it.c))) return false;
  if (skip !== 'tag' && st.tag.size && ![...st.tag].every(t => it.t.includes(t))) return false;
  if (st.q){ const hay = (it.n+' '+it.b+' '+it.sz).toLowerCase(); if (!st.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false; }
  return true;
}
function chips(el, list, key, labelOf, valOf, count){
  el.innerHTML = list.map(x => { const v = valOf(x), n = count(v);
    return `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${st[key].has(v)}">${esc(labelOf(x))}<span class="n">${n}</span></button>`; }).join('');
}
function renderChips(){
  const b = base();
  const cnt = (skip, f) => v => b.filter(it => match(it, skip) && f(it, v)).length;
  chips($('stores'), STORES, 'store', s=>s, slug, cnt('store', (it,v)=>slug(it.s)===v));
  const ba = base(true), cntT = v => ba.filter(it => match(it, 'tag') && it.t.includes(v)).length;
  chips($('tags'), TAGS, 'tag', t => t[0]==='kid' ? 'Kid-friendly (maybe)' : t[1], t=>t[0], cntT);
  chips($('cats'), CATS, 'cat', c=>c, slug, cnt('cat', (it,v)=>slug(it.c)===v));
}
const money = v => '$' + v.toFixed(2);
const KIND = {coupon:'Digital coupon', matchup:'Coupon matchup'};
function card(it){
  const priced = it.p != null;
  const ptxt = priced ? `${money(it.p)}<small>${it.per==='lb' ? 'per lb' : (it.t.includes('bogo') || /\d\s*(for|\/)\s*\$/i.test(it.deal) ? 'each (est.)' : '')}</small>` : esc(it.deal || 'See ad');
  const meta = [it.b && it.b !== 'Other' && !it.n.toLowerCase().includes(it.b.toLowerCase()) ? it.b : '', it.sz].filter(Boolean).map(esc).join(' · ');
  const deal = priced ? esc(it.deal) + (it.terms ? ' · ' + esc(it.terms) : '') : esc(it.terms);
  const save = it.pct ? `<span class="save">save ${it.pct}%${it.sv ? ' (' + money(it.sv) + ')' : ''}</span>` : '';
  const tags = it.t.map(t => `<span class="tag t-${t}">${esc(t==='kid' ? 'Kid-friendly?' : TAGL[t])}</span>`).join('');
  const was = it.was ? `<div class="was"><b>Price changed:</b> was ${esc(it.was.deal)}${it.was.p != null && !String(it.was.deal).includes(money(it.was.p)) ? ' (≈' + money(it.was.p) + (it.was.per === 'lb' ? '/lb' : '') + ')' : ''}</div>` : '';
  return `<article class="card${it.t.includes('ended') ? ' ended' : ''}" data-id="${it.id}" data-k="${it.k}">
${KIND[it.k] ? `<div class="kind">${KIND[it.k]}</div>` : ''}
<div class="r1"><h3>${esc(it.n)}</h3><div class="price${priced?'':' terms'}">${ptxt}</div></div>
${meta ? `<div class="meta">${meta}</div>` : ''}
${deal || save ? `<div class="deal">${deal}${save}</div>` : ''}
${was}
${it.u && it.per !== 'lb' ? `<div class="unit">≈ ${esc(it.u)} (est.)</div>` : ''}
${tags ? `<div class="tags">${tags}</div>` : ''}
${it.notes.map(n => `<div class="note">${esc(n)}</div>`).join('')}
${it.stack.map(s => `<div class="stack"><b>Coupon stack (${esc(s.src)}):</b> ${esc(s.text)}</div>`).join('')}
<div class="foot"><span class="st s-${it.s}">${it.s}</span><span>${esc(it.v)}</span><span>${esc(it.c)}</span>${it.link ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.lt)} ↗</a>` : ''}</div>
</article>`;
}
function sorter(){
  const si = s => STORES.indexOf(s), ci = c => CATS.indexOf(c);
  const pri = it => (it.t.includes('best')?0:it.k==='deal'?1:2);
  const md = s => { const m = /(\d+)\/(\d+)/.exec(s||''); return m ? (+m[1])*40 + (+m[2]) : -1; };
  const nm = (a,b) => pri(a)-pri(b) || (a.p==null)-(b.p==null) || a.n.localeCompare(b.n);
  return {category:(a,b)=>ci(a.c)-ci(b.c)||si(a.s)-si(b.s)||nm(a,b),
          store:(a,b)=>si(a.s)-si(b.s)||ci(a.c)-ci(b.c)||nm(a,b),
          price:(a,b)=>(a.p==null)-(b.p==null)||(a.p??0)-(b.p??0)||nm(a,b),
          newest:(a,b)=>b.t.includes('new')-a.t.includes('new')||b.t.includes('changed')-a.t.includes('changed')||md(b.st)-md(a.st)||ci(a.c)-ci(b.c)||nm(a,b),
          savings:(a,b)=>(a.pct==null)-(b.pct==null)||(b.pct??0)-(a.pct??0)||(b.sv??0)-(a.sv??0)||nm(a,b)}[st.sort];
}
function render(){
  writeHash(); renderChips();
  $('q').value = st.q; $('qx').style.display = st.q ? 'block' : 'none';
  $('sort').value = st.sort; $('group').value = st.group; $('gm').checked = st.gm;
  const b = base(), res = b.filter(it => match(it)).sort(sorter());
  const nf = st.store.size + st.cat.size + st.tag.size + (st.q?1:0);
  const na = st.cat.size + (st.gm?1:0) + (st.sort!=='category'?1:0) + (st.group!=='store'?1:0);
  $('fbtn').textContent = na ? `More (${na})` : 'More';
  const act = [...[...st.store].map(v=>STORES.find(x=>slug(x)===v)), ...[...st.tag].map(t=>t==='kid'?'Kid-friendly':TAGL[t]), ...[...st.cat].map(v=>CATS.find(x=>slug(x)===v)), st.q ? `"${st.q}"` : ''].filter(Boolean);
  $('count').textContent = `Showing ${res.length} of ${b.length} items` + (act.length ? ` · ${act.join(' + ')}` : '');
  $('clear').style.visibility = nf ? 'visible' : 'hidden';
  if (!res.length){ $('list').innerHTML = '<div class="empty">No deals match. Try clearing a filter.</div>'; return; }
  const vis = res.slice(0, shown);
  let html = '';
  if (st.group === 'none') html = `<div class="grid">${vis.map(card).join('')}</div>`;
  else {
    const key = st.group === 'store' ? 's' : 'c', order = st.group === 'store' ? STORES : CATS;
    const tot = {}; res.forEach(it => tot[it[key]] = (tot[it[key]]||0)+1);
    order.forEach(g => { const gi = vis.filter(it => it[key] === g); if (!gi.length) return;
      html += `<h2 class="grp">${st.group==='store' ? `<span class="st s-${g}">${g}</span>` : esc(g)} <span class="cnt">${tot[g]} ${tot[g] === 1 ? 'item' : 'items'}</span></h2><div class="grid">${gi.map(card).join('')}</div>`; });
  }
  if (res.length > shown) html += `<button class="more" id="more">Show more (${res.length - shown} left)</button>`;
  $('list').innerHTML = html;
  const mb = $('more'); if (mb) mb.onclick = () => { shown += PAGE * 2; render(); };
}
function header(){
  $('date').textContent = M.date;
  const g = ITEMS.filter(i=>!i.gm && !i.t.includes('ended')), deals = g.filter(i=>i.k==='deal');
  const by = s => deals.filter(i=>i.s===s).length, n = k => g.filter(i=>i.k===k).length, nt = t => g.filter(i=>i.t.includes(t)).length;
  $('sub').textContent = `Ad week ${M.week} · ${deals.length} deals (Publix ${by('Publix')}, Aldi ${by('Aldi')}, Walmart ${by('Walmart')}), ${n('coupon')} digital coupons, ${n('matchup')} coupon ${n('matchup') === 1 ? 'matchup' : 'matchups'}${M.area ? ' · ' + M.area : ''}`;
  const pd = M.prior_date ? new Date(M.prior_date + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : '';
  $('chg').innerHTML = M.prior ? `<span>What changed since ${esc(pd)}:</span>` + [['new','new'],['changed','price changed'],['ended','ended']].map(([k,l]) =>
     `<button class="c-${k}" data-tag="${k}">${M.changes[k]} ${l}</button>`).join('') : '<span>No earlier day to compare yet.</span>';
  $('chg').onclick = e => { const b = e.target.closest('button[data-tag]'); if (!b) return; st.tag = new Set([b.dataset.tag]); st.store.clear(); st.cat.clear(); st.q = ''; shown = PAGE; render(); document.querySelector('.status').scrollIntoView({behavior:'smooth'}); };
  $('updbody').innerHTML = M.summary || '';
  if (!M.summary) $('upd').hidden = true;
  $('foot').innerHTML = `Prices come from the stores' own ads: the Publix weekly ad for ${esc(M.publix)}, and the ALDI ad and Walmart flyer via Flipp. Coupon stacks come from Publix digital coupons and Southern Savers. "Est." unit prices are worked out from the listed size, and BOGO prices assume you buy 2. Items without a price show the deal terms only. Data fetched ${esc(M.fetched)}. Nothing here has been clipped or added to a cart. Compared with the ${M.prior ? esc(M.prior_date) : 'previous'} page: "New" wasn't listed then, "Price changed" is the same listing with a different price or terms, and "Ended" was listed then but is gone today (shown only with the Ended filter). For a price check on any item, just ask Grocery Deals.`;
}
document.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const s = st[c.dataset.k], v = c.dataset.v; s.has(v) ? s.delete(v) : s.add(v); shown = PAGE; render();
});
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { st.q = e.target.value.trim(); shown = PAGE; render(); }, 150); });
$('qx').onclick = () => { st.q = ''; render(); $('q').focus(); };
$('sort').onchange = e => { st.sort = e.target.value; render(); };
$('group').onchange = e => { st.group = e.target.value; render(); };
$('gm').onchange = e => { st.gm = e.target.checked; shown = PAGE; render(); };
$('clear').onclick = () => { st.store.clear(); st.cat.clear(); st.tag.clear(); st.q = ''; shown = PAGE; render(); };
$('fbtn').onclick = () => { const p = $('panel'), open = p.hidden; p.hidden = !open; $('fbtn').setAttribute('aria-expanded', open); };
window.addEventListener('hashchange', () => { readHash(); shown = PAGE; render(); });
readHash(); header();
{ const adv = st.cat.size || st.gm || st.sort !== 'category' || st.group !== 'store';
  const open = window.innerWidth >= 720 || adv; $('panel').hidden = !open; $('fbtn').setAttribute('aria-expanded', open); }
render();
</script>
