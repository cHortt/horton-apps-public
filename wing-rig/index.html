<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WING Rig Visualizer — Live Audio Schematic & Patch Manager</title>
    <meta
      name="description"
      content="Interactive Behringer WING audio rig visualizer with click-to-trace signal routing, client-side .snap snapshot importer, and binder-ready PDF patch sheets."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M5 10l4.5 12h2.2l4.3-9 4.3 9h2.2L27 10h-2.8l-2.9 8.2L17.2 10h-2.4l-4.1 8.2L7.8 10H5z' fill='%2338bdf8'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('wing-rig:prefs:v1');
          var theme = raw ? JSON.parse(raw).theme : 'system';
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f3f5f8] text-slate-900 dark:bg-[#090d14] dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
