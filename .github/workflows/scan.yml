name: scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gl.tgz
      - name: gitleaks (full history)
        run: gitleaks git . --redact --no-banner -v
      - name: PII scan (generic patterns)
        run: python3 scripts/pii_scan.py
      - name: Allowed paths only
        run: |
          bad=$(git ls-files | grep -vE '^(README\.md|POLICY\.md|\.nojekyll|\.gitignore|index\.html|grocery/(index|[0-9]{4}-[0-9]{2}-[0-9]{2})\.html|scripts/pii_scan\.py|scripts/pii_allow\.txt|\.github/workflows/scan\.yml)$' || true)
          if [ -n "$bad" ]; then echo "Files outside the public allowlist:"; echo "$bad"; exit 1; fi
          echo "All tracked files are on the allowlist."
