name: wing-rig

on:
  push:
    paths:
      - "wing-rig/**"
      - ".github/workflows/wing-rig.yml"
  pull_request:
    paths:
      - "wing-rig/**"
      - ".github/workflows/wing-rig.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wing-rig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wing-rig/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
